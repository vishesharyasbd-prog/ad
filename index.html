<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: #080808;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(ellipse at 50% 15%,
    rgba(190,145,50,.13), transparent 55%),
    linear-gradient(145deg,#080808,#11100c 55%,#050505);
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

.wrapper {
  width: 100%;
  max-width: 390px;
  margin: auto;
}

.card {
  position: relative;
  width: 100%;
  padding: 38px 25px 27px;
  text-align: center;
  border: 1px solid rgba(218,178,90,.28);
  border-radius: 25px;
  background: rgba(255,255,255,.045);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  box-shadow:
    0 20px 65px rgba(0,0,0,.55),
    inset 0 1px 1px rgba(255,255,255,.08);
}

.logo {
  width: 86px;
  height: 86px;
  margin: 0 auto 23px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 2px solid #d8ad55;
  background: linear-gradient(145deg,#292014,#0c0b08);
  box-shadow: 0 0 30px rgba(212,165,70,.18);
  color: #f0ce82;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 1px;
}

.tag {
  color: #d9b66d;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 12px;
}

h1 {
  color: #f1d18b;
  font-size: 27px;
  line-height: 1.3;
  font-weight: 800;
  margin-bottom: 13px;
  overflow-wrap: anywhere;
}

.description {
  color: #b9b5ad;
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 27px;
}

.line {
  width: 55px;
  height: 2px;
  margin: 0 auto 24px;
  background: linear-gradient(90deg,transparent,#d8ad55,transparent);
}

.join-btn {
  width: 100%;
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: 1px solid #f0d18c;
  border-radius: 13px;
  background: linear-gradient(110deg,#a87827,#e5c276,#ad802e);
  color: #130e06;
  text-decoration: none;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: .4px;
  box-shadow: 0 7px 24px rgba(197,151,62,.19);
  transition: transform .2s ease, box-shadow .2s ease;
  -webkit-tap-highlight-color: transparent;
}

.join-btn:active {
  transform: scale(.98);
}

.telegram-icon {
  font-size: 19px;
}

.footer {
  color: #77736b;
  font-size: 10px;
  letter-spacing: 1px;
  margin-top: 25px;
}

@media(max-width:360px) {
  .card {
    padding: 30px 19px 23px;
  }
  h1 {
    font-size: 24px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    transition: none !important;
  }
}
</style>
</head>

<body>

<main class="wrapper">
  <section class="card">

    <div class="logo">AV</div>

    <div class="tag">OFFICIAL TELEGRAM CHANNEL</div>

    <h1>Adarsh Ki Vaani ™️</h1>

    <div class="line"></div>

    <p class="description">
      Welcome to Adarsh Ki Vaani.
      Join our official Telegram channel
      and stay connected with us.
    </p>
 <a
      href="https://t.me/+i0CF4kU9VpRhOWQ1"
      class="join-btn"
      id="joinButton"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="telegram-icon">➤</span>
      JOIN CHANNEL NOW
    </a>

    <div class="footer">
      ADARSH KI VAANI ™️ · OFFICIAL COMMUNITY
    </div>

  </section>
</main>

<script>
(function () {
  const button = document.getElementById('joinButton');
  let subscribeFired = false;

  button.addEventListener('click', function () {

    if (subscribeFired) return;

    subscribeFired = true;

    if (typeof window.fbq === 'function') {
      window.fbq('track', 'Subscribe');
    }

  });
})();
</script>

</body>
</html>
