<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: #080808;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  overflow-x: hidden;
  font-family: Arial, Helvetica, sans-serif;
  color: #fff;

  background:
    radial-gradient(
      ellipse at 50% 18%,
      rgba(202,159,76,.14),
      transparent 55%
    ),
    #080808;
}

/* MAIN CONTAINER */
.wrapper {
  width: 100%;
  max-width: 380px;
  margin: auto;
}

/* GLASS CARD */
.card {
  width: 100%;
  padding: 26px 20px 19px;
  text-align: center;

  border: 1px solid rgba(218,177,91,.30);
  border-radius: 21px;

  background: rgba(255,255,255,.045);

  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);

  box-shadow:
    0 12px 35px rgba(0,0,0,.4),
    inset 0 1px rgba(255,255,255,.07);
}

/* LOGO */
.logo {
  width: 72px;
  height: 72px;
  margin: 0 auto 16px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 2px solid #d8ad55;
  border-radius: 50%;

  background: linear-gradient(145deg,#302414,#0b0a08);

  color: #f0cf88;
  font-size: 23px;
  font-weight: 800;
  letter-spacing: 1px;
}

/* TOP LABEL */
.tag {
  margin-bottom: 8px;
  color: #d9b66d;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
}

/* HEADING */
h1 {
  margin-bottom: 12px;
  color: #f1d18b;
  font-size: 26px;
  line-height: 1.25;
  font-weight: 800;
  overflow-wrap: anywhere;
}

/* DIVIDER */
.divider {
  width: 48px;
  height: 2px;
  margin: 0 auto 15px;
  background: #d5ad62;
}

/* DESCRIPTION */
.description {
  margin: 0 0 19px;
  color: #bcb7ac;
  font-size: 12px;
  line-height: 1.55;
}

/* JOIN BUTTON */
.join-btn {
  width: 100%;
  min-height: 51px;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;

  padding: 12px;

  border: 1px solid #f1d18b;
  border-radius: 11px;

  background: linear-gradient(
    110deg,
    #a87827,
    #e7c77d,
    #ae812f
  );

  color: #130e06;
  text-decoration: none;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: .4px;

  -webkit-tap-highlight-color: transparent;
}

.join-btn:active {
  opacity: .88;
}

.telegram-icon {
  font-size: 18px;
  line-height: 1;
}

/* FOOTER */
.footer {
  margin-top: 16px;
  color: #77736b;
  font-size: 9px;
  letter-spacing: .8px;
  line-height: 1.4;
}

/* SMALL MOBILE */
@media(max-width:360px) {

  .card {
    padding: 23px 16px 17px;
  }

  h1 {
    font-size: 23px;
  }

}

</style>
</head>

<body>

<main class="wrapper">

  <section class="card">

    <div class="logo">AV</div>

    <div class="tag">
      OFFICIAL TELEGRAM CHANNEL
    </div>

    <h1>Adarsh Ki Vaani ™️</h1>

    <div class="divider"></div>

    <p class="description">
      Welcome to Adarsh Ki Vaani.
      Join our official Telegram channel
      and stay connected with us.
    </p>
 <!-- TELEGRAM JOIN BUTTON -->
    <a
      href="https://t.me/+i0CF4kU9VpRhOWQ1"
      class="join-btn"
      id="joinButton"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="telegram-icon">➤</span>
      JOIN CHANNEL NOW
    </a>

    <div class="footer">
      ADARSH KI VAANI ™️ · OFFICIAL COMMUNITY
    </div>

  </section>

</main>

<!-- MANUAL SUBSCRIBE EVENT -->
<script>
(function () {

  const joinButton = document.getElementById('joinButton');

  let subscribeFired = false;

  joinButton.addEventListener('click', function () {

    if (subscribeFired) {
      return;
    }

    subscribeFired = true;

    // MANUAL META PIXEL SUBSCRIBE EVENT
    if (typeof window.fbq === 'function') {
      window.fbq('track', 'Subscribe');
    }

  }, { once: true });

})();
</script>

</body>
</html>
